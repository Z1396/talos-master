# ===================== 全局默认配置（主机名无匹配时生效） =====================
# 硬件/数据传输后端类型
# 可选值对应程序枚举：Daedalus / Direct / CameraOnly / Chiral
backend = "Daedalus"

# 机器人型号，对应 config/robot/[名称].toml 配置文件
# 可选：infantry(步兵)、hero(英雄)、sentry(哨兵)、drone(无人机) 等
robot = "infantry_4"  

# 视觉方案名称，对应 config/vision/[名称].toml 配置文件
vision = "daedalus_vision"

# ==============================================================================
# 【核心：主机名自动预设匹配】
# 程序启动时会读取当前设备主机名，在这里查表自动覆盖上面的默认配置
# 匹配规则：
# 1. 本机主机名 和 [preset] 下 key 完全一致 → 使用该条配置，覆盖全局默认
# 2. 无任何匹配 → 沿用文件开头 backend/robot/vision 全局默认值
# 一旦出现 [任意表]，根表就结束！后面再也不能写无根表的配置
# ==============================================================================
[preset]
# 设备主机名 "ax650" → 无人机方案
"ax650" = { robot = "drone", vision = "drone" }

# 设备主机名 "blackjack.local" → 步兵4号 + Daedalus 后端
"blackjack.local" = { backend = "Daedalus", robot = "infantry_4", vision = "daedalus_vision" }

# 设备主机名 "hero.local" → 英雄机器人方案
"hero.local" = { robot = "hero", vision = "hero_vision" }

# 设备主机名 "nuc" → 雷达机器人 + 仅相机模式
"nuc" = { backend = "CameraOnly", robot = "radar", vision = "radar" }

# 设备主机名 "ax650-2.local" → 全向移动机器人
"ax650-2.local" = { robot = "omni", vision = "omni" }

# 设备主机名 "ax650-1.local" → 步兵AX1 + 标准视觉
"ax650-1.local" = { robot = "infantry_ax_1", vision = "std" }

# 设备主机名 "sentry" → 哨兵机器人
"sentry" = { robot = "sentry", vision = "sentry" }

# 设备主机名 "ax650-hero" → AX平台英雄机器人
"ax650-hero" = { robot = "hero", vision = "hero" }

# 设备主机名 "ax650-doggy" → 机器狗方案
"ax650-doggy" = { robot = "doggy", vision = "doggy" }

# 设备主机名 "tegra-ubuntu" → 英伟达Jetson平台 步兵NX
"tegra-ubuntu" = { robot = "infantry_nx", vision = "nx" }

# 设备主机名 "byq" → 步兵4号 + Daedalus 后端
"byq" = { backend = "Daedalus", robot = "infantry_4", vision = "daedalus_vision" }

# ==============================================================================
# Foxglove 可视化/数据回放服务配置
# 对应 C++ 代码里的 foxglove 配置项，用于上位机连接、实时画面/数据查看
# ==============================================================================
[foxglove]
# 是否启用 Foxglove 服务
enabled = true

# 数据传输协议：WebSocket（网页/上位机标准长连接协议）
transport = "WebSocket"

# 监听IP：0.0.0.0 监听本机所有网卡，允许局域网内其他设备连接
host = "0.0.0.0"

# 服务端口，上位机连接时使用
port = 8765

# 录制MCAP数据包的默认存储路径（Foxglove标准录像格式）
mcap_path = "record/foxglove.mcap"

# Foxglove 内置 Quanta 视频编码参数（画面推流编码配置）
[foxglove.quanta]
target_bitrate = 67500   # 目标码率（单位：bps）
max_width = 200          # 视频最大宽度
max_height = 200         # 视频最大高度
gop_size = 50            # 关键帧间隔（GOP）
framerate = 30           # 视频帧率 30fps
preset = "fast"          # 编码预设：fast 兼顾速度与画质
tune = "ssim"            # 编码调优方向：基于SSIM图像相似度优化画质

# ==============================================================================
# 本地数据录制器配置（独立录制模块）
# 对应 C++ capturer 配置，程序内置数据录制功能
# ==============================================================================
[capturer]
# 是否开启本地录制功能
enabled = false

# 录制文件存放根目录
output_dir = "record"

# 磁盘预留最小空闲空间（字节），低于该值停止录制，防止磁盘写满
reserved_free_bytes = 2097152

# ==============================================================================
# 任务调度器配置
# 控制程序内部线程、任务调度的统计输出
# ==============================================================================
[scheduler]
# 是否定时打印调度器运行统计（线程负载、任务耗时等）
print_stats = false