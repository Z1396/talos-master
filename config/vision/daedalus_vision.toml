# Infantry Vision Configuration
# extend from vision_base.toml
# 步兵视觉整套配置，继承 vision_base.toml 基础公共配置
# base 文件存放所有兵种通用视觉参数；本文件覆盖步兵独有的参数

# ============================================================================
# L5 开火门收紧（Daedalus 联调专用覆盖）
# vision_base.toml 默认窗口偏大（0.32m/0.42m），5m 目标容差约 2.4°，容易边缘开火。
# 这里按“装甲板中心命中”口径收紧，提高单发精度；若射频过低再往 0.16m 放松。
# ============================================================================
fire_decision.fire_thresh = 0.008444444           # ~0.17° 角度下限，防止远距离容差过小
fire_decision.shooting_range_h = 0.12         # 射击窗口高度（米）
fire_decision.shooting_range_w_small = 0.12  # 小装甲板射击窗口宽度（米）
fire_decision.shooting_range_w_large = 0.24  # 大装甲板射击窗口宽度（米）

# 全链路延迟补偿起始值：跨机网络 + JPEG + 检测/PnP/EKF + IPC 的保守估计。
# 打移动靶时如果整体偏慢，按 10ms 步进往上调；偏超前则往小调。
aimer.delay = 0.17                  # 17ms 延迟补偿，根据实际情况调整

# ============================================================================
# L5 MPC 直通模式（Daedalus 联调专用）
# 调度统计显示 enhanced_weapon_control 偶发 14~388ms 长阻塞，导致 GimbalCmd 输出率
# 从 250Hz 掉到 100Hz 以下。联调阶段跳过 MPC，直接用 L4 参考轨迹，先保证指令率稳定。
# 注意：必须写在根作用域（[traditional] 表之前），否则会被解析成 traditional.mpc_weapon。
# ============================================================================
mpc_weapon.enabled = true
mpc_weapon.enable_debug = false

# L4 trajectory compensation overrides
# L4规划层弹道补偿参数（覆盖基础配置）
trajectory.type = "Ideal"
# 弹道模型类型：Ideal = 理想质点弹道模型
# 仅考虑重力，**不计算空气阻力**；适合近距离步兵对抗，计算速度快

trajectory.diameter = 0.017
# 弹丸直径 单位：米
# 17mm 步兵弹丸（RoboMaster 步兵17mm弹）

trajectory.mass = 0.00312
# 弹丸质量 单位：千克
# 3.12g 步兵标准弹

trajectory.gravity = 9.81
# 重力加速度 m/s²

[traditional]
# Traditional 传统图像处理模块（L2层灯条二值化、装甲检测）
advanced_binary = true
# 是否启用高级自适应二值化
# false：使用固定阈值二值，算力占用低；光照稳定场景使用
# true：自适应阈值，强光、逆光环境鲁棒性更强，消耗更多CPU

binary_threshold = 65
# 固定灰度二值化阈值
# 图像灰度大于该值才保留，用于筛选灯条高光区域
# 数值越高，保留的区域越少；越低越容易引入噪点

light_max_angle = 10.0
# 灯条最大倾斜角度阈值(°)
# 筛选灯条轮廓：倾斜角度超过10°直接丢弃，过滤无效干扰轮廓