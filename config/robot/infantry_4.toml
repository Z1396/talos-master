[camera]
camera_matrix = [2451.41, 0, 799.83, 0, 2455.74, 566.662, 0, 0, 1]
distort_coefficient = [-0.022426, 0.23621, 0.00142727, 0.00490628, -0.343924] # 畸变参数(k1,k2,p1,p2,k3)
width = 1440 # 图像宽度
height = 1080 # 图像高度

# [calibration_info]
# rms_error = 0.196189    # 标定均方根误差（2026-10-01，对焦0.7m/F16）
# num_samples = 31         # 标定使用样本数量

[camera.profile]
trigger_mode = false     # 是否使用外部触发模式
invert_image = false     # 是否翻转图像
exposure_time_us = 2000 # 曝光时间(微秒)
gain = 12.0              # 相机增益

[extrinsic.gimbal_yaw.gimbal_pitch]
translation = [-0.00563, 0, 0.08139] # 云台pitch坐标到云台yaw坐标的平移偏移

camera_link.translation = [0.05925, 0, 0.04313] # 相机相对于pitch安装位置偏移

muzzle_link.translation = [0.04624, 0.0, 0.0] # 枪口坐标相对pitch安装位置的偏移
muzzle_link.roll = 0.0                        # 枪口横滚角

# 偏高就+n，偏低就-n
# 压低 +n，抬高 -n
# muzzle_link.pitch = -0.25

muzzle_link.pitch = 0.6 # 枪口俯仰角补偿
muzzle_link.yaw = -2.3  # 枪口水平角补偿


[mcu]
mcu_authoritative_self_color = true   # MCU是否作为自身颜色判断来源
mcu_authoritative_bullet_speed = true # MCU是否作为弹速来源

bullet_speed_default = 24.0 # 默认子弹速度(m/s)
bullet_speed_min = 20.0     # 最小子弹速度(m/s)
bullet_speed_max = 25.0     # 最大子弹速度(m/s)
